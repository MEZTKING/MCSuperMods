# Publishes a draft GitHub Release made by release.yml (Actions > Publish release > Run workflow).
# The user allowed the main session to publish releases on 2026-11-05; before that, drafts
# were published by hand (ADR 0018). The run refuses unless the draft for the tag exists, is
# the only release for that tag, and holds exactly four assets: the installer, its `.blockmap`
# and `latest.yml`, which the in-app updater needs, and the `@msm/plugin-api` tarball
# `msm-plugin-api-<version>.tgz` (ADR 0036).
name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the v (for example 0.3.0)."
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ inputs.version }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check and publish the draft
        shell: bash
        run: |
          set -euo pipefail
          releases=$(gh api "repos/${GH_REPO}/releases?per_page=100" --jq "[.[] | select(.tag_name == \"${TAG}\")]")
          count=$(jq 'length' <<<"$releases")
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected one release for ${TAG}, found ${count}."
            exit 1
          fi
          if [ "$(jq -r '.[0].draft' <<<"$releases")" != "true" ]; then
            echo "${TAG} is already published."
            exit 0
          fi
          assets=$(jq -r '.[0].assets[].name' <<<"$releases" | sort)
          echo "Assets:"; echo "$assets"
          # The names electron-builder gives the NSIS installer (artifactName in
          # app/electron-builder.yml), which latest.yml's `path` and `files[].url` point at.
          installer="MCSuperMods-${VERSION}-win-x64.exe"
          exe=$(grep -cxF "$installer" <<<"$assets" || true)
          map=$(grep -cxF "${installer}.blockmap" <<<"$assets" || true)
          yml=$(grep -cx 'latest.yml' <<<"$assets" || true)
          tgz=$(grep -c '^msm-plugin-api-.*\.tgz$' <<<"$assets" || true)
          total=$(grep -c . <<<"$assets" || true)
          if [ "$exe" -ne 1 ] || [ "$map" -ne 1 ] || [ "$yml" -ne 1 ] || [ "$tgz" -ne 1 ] || [ "$total" -ne 4 ]; then
            echo "::error::The ${TAG} draft must hold exactly ${installer}, ${installer}.blockmap, latest.yml and the msm-plugin-api tarball."
            exit 1
          fi
          # The updater reads latest.yml: it must name this version and this installer.
          id=$(jq -r '.[0].id' <<<"$releases")
          yml_id=$(jq -r '.[0].assets[] | select(.name == "latest.yml") | .id' <<<"$releases")
          gh api -H "Accept: application/octet-stream" "repos/${GH_REPO}/releases/assets/${yml_id}" > latest.yml
          cat latest.yml
          if ! grep -qx "version: ${VERSION}" latest.yml || ! grep -qx "path: ${installer}" latest.yml || ! grep -q '^sha512: ' latest.yml; then
            echo "::error::latest.yml in the ${TAG} draft does not name version ${VERSION}, ${installer} and a sha512."
            exit 1
          fi
          gh api -X PATCH "repos/${GH_REPO}/releases/${id}" -F draft=false -f make_latest=true >/dev/null
          echo "Published ${TAG}."
