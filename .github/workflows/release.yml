# Release builds (ADR 0013). Windows only for now (user decision, 2026-11-04): an unsigned
# NSIS x64 installer. The Linux `dir` build is a verification target for CI, not a release
# artefact, and macOS is out of scope.
#
# Runs on `v*` tags and manually. On a tag the workflow creates one DRAFT GitHub Release of
# MEZTKING/MCSuperMods named after the version in app/package.json, then electron-builder
# publishes into it (ADR 0018): the installer, its `.blockmap` and `latest.yml`, which a last
# step checks. The maintainer reviews and
# publishes the draft by hand; the in-app updater only sees published releases.
#
# Manual runs (Actions > Release > Run workflow):
# - with a version (for example 0.2.4) and optionally a commit: the workflow creates the tag
#   `v<version>` on that commit (default: the selected branch) with GITHUB_TOKEN, then builds
#   and uploads to a draft exactly as a tag push does. No local `git tag` is needed. A tag made
#   with GITHUB_TOKEN does not start a second run.
# - without a version: build only, no tag, no release; files kept as a workflow artefact.
# Action versions: checkout, setup-node and upload-artifact v7 (Node 24; checked 2026-11-04);
# setup-java and cache v6 (checked 2026-11-05).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v (for example 0.2.4). Leave empty to build without releasing."
        required: false
        default: ""
      commit:
        description: "Full 40-character commit SHA to tag. Leave empty for the tip of the selected branch."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CI: true
      # Unsigned until the user supplies signing credentials.
      CSC_IDENTITY_AUTO_DISCOVERY: false
      # The release tag for this run: the pushed tag, or v<version> for a manual release run,
      # or empty for a build-only run.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (inputs.version != '' && format('v{0}', inputs.version) || '') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit != '' && inputs.commit || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # A tag must match the version in app/package.json: electron-builder names the release
      # after the package version, so a mismatched tag (for example v0.2.1 on 0.2.2 code)
      # would silently publish under a different version.
      - name: Check the tag matches the app version
        if: env.RELEASE_TAG != ''
        shell: bash
        run: |
          version=$(node -p "require('./app/package.json').version")
          if [ "${RELEASE_TAG}" != "v${version}" ]; then
            echo "::error::Tag ${RELEASE_TAG} does not match app/package.json version ${version}. Tag v${version} instead."
            exit 1
          fi
      # Manual release runs create the tag on the checked-out commit. An existing tag must
      # already point at that commit; the workflow never moves a tag.
      - name: Create the tag (manual release runs)
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          # On a missing tag `gh api` exits non-zero and prints the 404 body to stdout, so test
          # the exit status rather than the output.
          if ! existing=$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '.object.sha' 2>/dev/null); then
            existing=""
          fi
          if [ -z "$existing" ]; then
            gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="$sha" >/dev/null
            echo "Created ${RELEASE_TAG} at $sha"
          elif [ "$existing" != "$sha" ]; then
            echo "::error::${RELEASE_TAG} already exists at $existing, not $sha. Pick that commit or a new version."
            exit 1
          else
            echo "${RELEASE_TAG} already at $sha"
          fi
      # The msm_runtime jar the app nests in Fabric content jars (ADR 0026 D4): built with JDK 25
      # (JUnit and GameTests included) and staged as app/build/runtime/msm_runtime.jar before
      # electron-builder packages the app.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('engine-mod/*.gradle.kts', 'engine-mod/gradle.properties', 'engine-mod/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build msm_runtime
        working-directory: engine-mod
        shell: bash
        run: ./gradlew build --no-daemon
      - name: Stage the runtime jar for the app
        shell: bash
        run: |
          mapfile -t jars < <(ls engine-mod/build/libs/msm_runtime-*.jar | grep -v -e '-sources\.jar$' -e '-dev\.jar$')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected one msm_runtime jar in engine-mod/build/libs, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          mkdir -p app/build/runtime
          cp "${jars[0]}" app/build/runtime/msm_runtime.jar
          echo "Staged ${jars[0]} as app/build/runtime/msm_runtime.jar"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # electron-builder uploads the installer and its `.blockmap` in parallel; when no release
      # exists for the tag, both uploads create one and the assets end up split across two
      # drafts (seen on v0.2.2). Creating the draft once first means it only ever finds it.
      - name: Create the draft release
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./app/package.json').version")
          count=$(gh release list --limit 100 --json tagName --jq "[.[] | select(.tagName == \"${RELEASE_TAG}\")] | length")
          if [ "$count" -gt 1 ]; then
            echo "::error::$count releases already exist for ${RELEASE_TAG}; delete the extra drafts and re-run."
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            gh release create "${RELEASE_TAG}" --draft --title "${version}" --notes "MCSuperMods ${version}" --verify-tag
          fi
      - name: Build the installer (and upload it to the draft release on tags)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            pnpm --filter @msm/app exec electron-builder --publish always
          else
            pnpm --filter @msm/app exec electron-builder --publish never
          fi
      # The updater needs all three files on one release: the installer, its `.blockmap` and
      # `latest.yml`. Upload `latest.yml` again if it is missing; fail on anything else.
      - name: Check the draft release assets
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./app/package.json').version")
          count=$(gh release list --limit 100 --json tagName --jq "[.[] | select(.tagName == \"${RELEASE_TAG}\")] | length")
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one release for ${RELEASE_TAG}, found $count."
            exit 1
          fi
          assets() { gh release view "${RELEASE_TAG}" --json assets --jq '.assets[].name'; }
          if ! assets | grep -qx "latest.yml"; then
            gh release upload "${RELEASE_TAG}" app/dist/latest.yml --clobber
          fi
          names=$(assets)
          echo "$names"
          missing=0
          for name in "MCSuperMods-${version}-win-x64.exe" "MCSuperMods-${version}-win-x64.exe.blockmap" "latest.yml"; do
            if ! grep -qx "$name" <<< "$names"; then
              echo "::error::The draft release ${RELEASE_TAG} is missing $name."
              missing=1
            fi
          done
          exit $missing
      # Installer budget (tools/check-size/README.md): the NSIS installer is at most 150 MB.
      - name: Check installer size
        shell: bash
        run: |
          for file in app/dist/*.exe; do
            size=$(wc -c < "$file" | tr -d " ")
            echo "$file: $size bytes"
            if [ "$size" -gt $((150 * 1024 * 1024)) ]; then
              echo "::error::$file is over the 150 MB installer budget"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: MCSuperMods-windows
          path: |
            app/dist/*.exe
            app/dist/*.blockmap
            app/dist/latest.yml
          if-no-files-found: error
