# Release builds (ADR 0013). Windows only for now (user decision, 2026-11-04): an unsigned
# NSIS x64 installer. The Linux `dir` build is a verification target for CI, not a release
# artefact, and macOS is out of scope.
#
# Runs on `v*` tags and manually. On a tag the workflow creates one DRAFT GitHub Release of
# MEZTKING/MCSuperMods named after the version in app/package.json, then electron-builder
# publishes into it (ADR 0018): the installer, its `.blockmap` and `latest.yml`, which a last
# step checks. The maintainer reviews and
# publishes the draft by hand; the in-app updater only sees published releases. Manual runs
# build without publishing and keep the files as a workflow artefact.
# Action versions: checkout, setup-node and upload-artifact v7 (Node 24; checked 2026-11-04).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      CI: true
      # Unsigned until the user supplies signing credentials.
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # A tag must match the version in app/package.json: electron-builder names the release
      # after the package version, so a mismatched tag (for example v0.2.1 on 0.2.2 code)
      # would silently publish under a different version.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./app/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app/package.json version ${version}. Tag v${version} instead."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # electron-builder uploads the installer and its `.blockmap` in parallel; when no release
      # exists for the tag, both uploads create one and the assets end up split across two
      # drafts (seen on v0.2.2). Creating the draft once first means it only ever finds it.
      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./app/package.json').version")
          count=$(gh release list --limit 100 --json tagName --jq "[.[] | select(.tagName == \"${GITHUB_REF_NAME}\")] | length")
          if [ "$count" -gt 1 ]; then
            echo "::error::$count releases already exist for ${GITHUB_REF_NAME}; delete the extra drafts and re-run."
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            gh release create "${GITHUB_REF_NAME}" --draft --title "${version}" --notes "MCSuperMods ${version}" --verify-tag
          fi
      - name: Build the installer (and upload it to the draft release on tags)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            pnpm --filter @msm/app exec electron-builder --publish always
          else
            pnpm --filter @msm/app exec electron-builder --publish never
          fi
      # The updater needs all three files on one release: the installer, its `.blockmap` and
      # `latest.yml`. Upload `latest.yml` again if it is missing; fail on anything else.
      - name: Check the draft release assets
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./app/package.json').version")
          count=$(gh release list --limit 100 --json tagName --jq "[.[] | select(.tagName == \"${GITHUB_REF_NAME}\")] | length")
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one release for ${GITHUB_REF_NAME}, found $count."
            exit 1
          fi
          assets() { gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name'; }
          if ! assets | grep -qx "latest.yml"; then
            gh release upload "${GITHUB_REF_NAME}" app/dist/latest.yml --clobber
          fi
          names=$(assets)
          echo "$names"
          missing=0
          for name in "MCSuperMods-${version}-win-x64.exe" "MCSuperMods-${version}-win-x64.exe.blockmap" "latest.yml"; do
            if ! grep -qx "$name" <<< "$names"; then
              echo "::error::The draft release ${GITHUB_REF_NAME} is missing $name."
              missing=1
            fi
          done
          exit $missing
      # Installer budget (tools/check-size/README.md): the NSIS installer is at most 150 MB.
      - name: Check installer size
        shell: bash
        run: |
          for file in app/dist/*.exe; do
            size=$(wc -c < "$file" | tr -d " ")
            echo "$file: $size bytes"
            if [ "$size" -gt $((150 * 1024 * 1024)) ]; then
              echo "::error::$file is over the 150 MB installer budget"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: MCSuperMods-windows
          path: |
            app/dist/*.exe
            app/dist/*.blockmap
            app/dist/latest.yml
          if-no-files-found: error
