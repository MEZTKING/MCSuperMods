name: CI

# Runs sparingly (user, 2026-11-22: "use the github actions as less as possible for now"):
# never for docs-only changes, a newer push cancels an older run of the same branch, and a
# commit whose message has [skip ci] is not built; run it by hand before moving main.
on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node app/node_modules/electron/install.js
      - run: xvfb-run -a pnpm --filter @msm/app smoke
      - run: xvfb-run -a pnpm --filter @msm/app e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: app/e2e/output
          if-no-files-found: ignore
      - run: pnpm --filter @msm/app dist:dir
      - run: xvfb-run -a pnpm --filter @msm/app smoke:packaged
      - run: node tools/check-size/index.ts

  # The external plugin build on Windows: `fixtures/sample-plugin/build.ts` runs the same steps
  # that `tools/new-plugin --external` writes for plugin authors, whose machines are mostly
  # Windows (drive-letter file URLs, `\` paths).
  windows-plugin:
    runs-on: windows-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @msm/sample-plugin...
      - run: pnpm --filter @msm/sample-plugin build
      - name: Check the schema export
        shell: bash
        run: |
          node -e 'const s = JSON.parse(require("node:fs").readFileSync("fixtures/sample-plugin/dist/symbols.json", "utf8")); const n = Object.keys(s.mcdoc).length; console.log(`${n} type(s)`); if (n === 0) process.exit(1);'

  # The msm_runtime Fabric mod (ADR 0024, ADR 0026 D6), once per Minecraft version (ADR 0038 D5):
  # JUnit and GameTests through `./gradlew build -Pmc=<mc>`, then the samples exported for target
  # mc-<mc> with that runtime nested and started on a headless Fabric dedicated server
  # (tools/run-fabric-server; the sample script twice on one world), and the sample data pack on
  # a vanilla server (tools/run-fabric-server/vanilla-datapack.ts), and the library's vanilla data
  # packs on one too (tools/run-fabric-server/vanilla-packs.ts). 26.3 also builds the ejected
  # Java projects and runs every parity run on both the content and the ejected jars; other
  # versions run parity on the content jars only. Every version also runs the client GameTests
  # on a headless client (Xvfb with Mesa's EGL, B356) and keeps their screenshots.
  # Action versions: setup-java and cache v6 (checked 2026-11-05).
  engine-mod:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per engine-mod/versions/<mc>.properties: that folder is the source of these
        # literals (check-deps does not scan workflow files). The 26.3 entry runs everything.
        mc: ["26.3", "26.4"]
    env:
      CI: true
      # The exporter golden tests export the samples for this target (B153).
      MSM_TARGET_ID: mc-${{ matrix.mc }}
    steps:
      # A full checkout: the JUnit corpus test reads packages/schemas/mcdoc/msm/conformance/
      # relative to engine-mod/, so both folders must stay side by side.
      - uses: actions/checkout@v7
      - name: Read the version facts
        id: facts
        run: |
          file="engine-mod/versions/${{ matrix.mc }}.properties"
          if [ ! -f "$file" ]; then
            echo "::error::No $file for matrix entry ${{ matrix.mc }}"
            exit 1
          fi
          minecraft=$(sed -n 's/^minecraft_version=//p' "$file" | tr -d '[:space:]')
          geckolib_id=$(sed -n 's/^geckolib_modrinth_version_id=//p' "$file" | tr -d '[:space:]')
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
          if [ -n "$geckolib_id" ]; then echo "geckolib=true" >> "$GITHUB_OUTPUT"; else echo "geckolib=false" >> "$GITHUB_OUTPUT"; fi
          echo "Minecraft $minecraft, GeckoLib id '${geckolib_id}'"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-mc${{ matrix.mc }}-${{ hashFiles('engine-mod/*.gradle.kts', 'engine-mod/parity/*.gradle.kts', 'engine-mod/gradle.properties', 'engine-mod/parity/gradle.properties', 'engine-mod/versions/*.properties', 'engine-mod/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-mc${{ matrix.mc }}-
      - name: Build msm_runtime (JUnit and GameTests)
        working-directory: engine-mod
        run: ./gradlew build -Pmc=${{ matrix.mc }} --no-daemon
      # The headless client GameTests (B356, ADR 0081 D6 (c); MsmParticleClientGameTest): a real
      # client in a singleplayer world draws the test particles. Xvfb's GLX has no sRGB config, so
      # the client's SDL3 OpenGL backend goes through Mesa's EGL (software rendering) on a 24-bit
      # screen. A separate task, never part of build; about two minutes. The screenshots are kept
      # as an artefact (saved, never compared).
      - name: Client GameTests (headless, Mesa EGL)
        working-directory: engine-mod
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends xvfb libegl1 libegl-mesa0 libgl1-mesa-dri
          SDL_VIDEO_FORCE_EGL=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x720x24" \
            ./gradlew runClientGameTest -Pmc=${{ matrix.mc }} --no-daemon
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-gametest-screenshots-mc${{ matrix.mc }}
          path: engine-mod/build/run/clientGameTest/screenshots
          if-no-files-found: ignore
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Restored before the exports: the sample-mob export downloads GeckoLib into this cache
      # (from the target's GeckoLib facts, SHA-512 checked) when it is missing.
      # The key names GeckoLib so caches saved before it was added are not reused.
      # The key names the vanilla server too (B241), so a cache saved before the data pack check
      # is not reused without it.
      - name: Cache Fabric server, vanilla server and GeckoLib downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/msm-fabric-server
          key: fabric-server-geckolib-vanilla-mc${{ matrix.mc }}-${{ hashFiles('packages/targets/*/src/target.ts') }}
      - name: Find the msm_runtime jar
        run: |
          mapfile -t jars < <(ls "$GITHUB_WORKSPACE"/engine-mod/build/libs/msm_runtime-*+mc${{ matrix.mc }}.jar | grep -v -e '-sources\.jar$' -e '-dev\.jar$')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected one msm_runtime +mc${{ matrix.mc }} jar in engine-mod/build/libs, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          echo "Runtime jar: ${jars[0]}"
          echo "MSM_RUNTIME_JAR=${jars[0]}" >> "$GITHUB_ENV"
      - name: Export the sample mod with the real runtime
        run: |
          MSM_SAMPLE_MOD_OUT="$RUNNER_TEMP/sample-mod" \
            pnpm --filter @msm/exporters exec vitest run test/sample-mod.golden.test.ts
          test -f "$RUNNER_TEMP/sample-mod/msm_sample_mod.jar"
          cat "$RUNNER_TEMP/sample-mod/fabric-facts.json"
      # The facts file comes from the target (MSM_TARGET_ID); its game version must be the one
      # this runtime was built against, or the server below would start the wrong game.
      - name: Check the facts name this Minecraft version
        run: |
          actual=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).minecraft' "$RUNNER_TEMP/sample-mod/fabric-facts.json")
          if [ "$actual" != "${{ steps.facts.outputs.minecraft }}" ]; then
            echo "::error::fabric-facts.json names Minecraft $actual, engine-mod/versions/${{ matrix.mc }}.properties ${{ steps.facts.outputs.minecraft }} (is MSM_TARGET_ID honoured?)"
            exit 1
          fi
      # On a version with GeckoLib the jar nests it (MSM_GECKOLIB_JAR); on one without (26.4)
      # the mobs are drawn by the runtime's vanilla renderer and the jar nests the runtime alone
      # (ADR 0072, B288, B306), so the sample mob is exported, served and parity-run everywhere.
      - name: Export the sample mob with the real runtime (and GeckoLib where the version has it)
        run: |
          MSM_GECKOLIB_JAR="$HOME/.cache/msm-fabric-server/geckolib.jar" MSM_SAMPLE_MOB_OUT="$RUNNER_TEMP/sample-mob" \
            pnpm --filter @msm/exporters exec vitest run test/sample-mob.golden.test.ts
          test -f "$RUNNER_TEMP/sample-mob/msm_sample_mob.jar"
          cat "$RUNNER_TEMP/sample-mob/fabric-facts.json"
      # The mob expansion's sample (ADRs 0070-0073, B302): six creatures, one per feature.
      - name: Export the sample creatures with the real runtime (and GeckoLib where the version has it)
        run: |
          MSM_GECKOLIB_JAR="$HOME/.cache/msm-fabric-server/geckolib.jar" MSM_SAMPLE_CREATURES_OUT="$RUNNER_TEMP/sample-creatures" \
            pnpm --filter @msm/exporters exec vitest run test/sample-creatures.golden.test.ts
          test -f "$RUNNER_TEMP/sample-creatures/msm_sample_creatures.jar"
          cat "$RUNNER_TEMP/sample-creatures/fabric-facts.json"
      # Containers and machines (ADRs 0074-0076, B323): six containers and three machines.
      - name: Export the sample machines with the real runtime
        run: |
          MSM_SAMPLE_MACHINES_OUT="$RUNNER_TEMP/sample-machines" \
            pnpm --filter @msm/exporters exec vitest run test/sample-machines.golden.test.ts
          test -f "$RUNNER_TEMP/sample-machines/msm_sample_machines.jar"
          cat "$RUNNER_TEMP/sample-machines/fabric-facts.json"
      # Custom portal blocks (ADRs 0077, 0078, B341): three portals, a frame block, a key, a
      # beacon and the project dimension sky_realm.
      - name: Export the sample portals with the real runtime
        run: |
          MSM_SAMPLE_PORTALS_OUT="$RUNNER_TEMP/sample-portals" \
            pnpm --filter @msm/exporters exec vitest run test/sample-portals.golden.test.ts
          test -f "$RUNNER_TEMP/sample-portals/msm_sample_portals.jar"
          cat "$RUNNER_TEMP/sample-portals/fabric-facts.json"
      # Custom particles (ADRs 0080, 0081, B358): three particle types, two blocks with ambient
      # particles, three items, an effect, a function and a script.
      - name: Export the sample particles with the real runtime
        run: |
          MSM_SAMPLE_PARTICLES_OUT="$RUNNER_TEMP/sample-particles" \
            pnpm --filter @msm/exporters exec vitest run test/sample-particles.golden.test.ts
          test -f "$RUNNER_TEMP/sample-particles/msm_sample_particles.jar"
          cat "$RUNNER_TEMP/sample-particles/fabric-facts.json"
      # Rules (ADR 0082, B380): five rule books on two blocks, an item, a mob and the world; two
      # plain rules compile to actions, the others to three generated scripts. The Sentinel uses
      # the runtime's vanilla renderer, so the content jar needs no GeckoLib on any version.
      - name: Export the sample rules with the real runtime
        run: |
          MSM_SAMPLE_RULES_OUT="$RUNNER_TEMP/sample-rules" \
            pnpm --filter @msm/exporters exec vitest run test/sample-rules.golden.test.ts
          test -f "$RUNNER_TEMP/sample-rules/msm_sample_rules.jar"
          cat "$RUNNER_TEMP/sample-rules/fabric-facts.json"
      # Vehicles, key binds and HUD elements (ADRs 0088-0091, B425): seven vehicles, a shell and a
      # repair kit, the flare and status keys, four HUD elements and the flares script. The export
      # also writes expect-lines.txt with the three registration lines the server check pins.
      - name: Export the sample vehicles with the real runtime
        run: |
          MSM_SAMPLE_VEHICLES_OUT="$RUNNER_TEMP/sample-vehicles" \
            pnpm --filter @msm/exporters exec vitest run test/sample-vehicles.golden.test.ts
          test -f "$RUNNER_TEMP/sample-vehicles/msm_sample_vehicles.jar"
          cat "$RUNNER_TEMP/sample-vehicles/fabric-facts.json"
          cat "$RUNNER_TEMP/sample-vehicles/expect-lines.txt"
      # Vanilla blocks of batch 1 (ADRs 0094-0096, 0101, B462): one block of each of the twenty new
      # types with their companions, a waterloggable lamp, tin that ages with waxed copies, three
      # bags, a bundle, two commands and two creative tabs (as_listed and by_name).
      - name: Export the sample vanilla blocks with the real runtime
        run: |
          MSM_SAMPLE_VANILLA_BLOCKS_OUT="$RUNNER_TEMP/sample-vanilla-blocks" \
            pnpm --filter @msm/exporters exec vitest run test/sample-vanilla-blocks.golden.test.ts
          test -f "$RUNNER_TEMP/sample-vanilla-blocks/msm_sample_vanilla_blocks.jar"
          cat "$RUNNER_TEMP/sample-vanilla-blocks/fabric-facts.json"
      # Villagers and fluids of batch 2 (ADRs 0098-0100, B482): a trader with its own and a vanilla
      # trade set, a villager profession and its job site block, a pack mule with storage, a shoulder
      # pet, a water-like and a lava-like fluid, and the Glow Moon dimension with its own type. The
      # mobs use the runtime's vanilla renderer, so the content jar needs no GeckoLib on any version.
      - name: Export the sample villagers and fluids with the real runtime
        run: |
          MSM_SAMPLE_VILLAGERS_OUT="$RUNNER_TEMP/sample-villagers" \
            pnpm --filter @msm/exporters exec vitest run test/sample-villagers-and-fluids.golden.test.ts
          test -f "$RUNNER_TEMP/sample-villagers/msm_sample_villagers.jar"
          cat "$RUNNER_TEMP/sample-villagers/fabric-facts.json"
      # Plants and storage of vanilla parity 3, batch 1 (ADRs 0103-0105, B520): the four plant
      # families with their companions, a project flower pot, bronze ageing on the six new
      # weathering types, double, per-player, waterlogged and ageing chests, own block and door
      # sounds, flatten and till, and the rules for vanilla blocks.
      - name: Export the sample plants and storage with the real runtime
        run: |
          MSM_SAMPLE_PLANTS_OUT="$RUNNER_TEMP/sample-plants" \
            pnpm --filter @msm/exporters exec vitest run test/sample-plants-and-storage.golden.test.ts
          test -f "$RUNNER_TEMP/sample-plants/msm_sample_plants.jar"
          cat "$RUNNER_TEMP/sample-plants/fabric-facts.json"
      # The sample mod's potion and its long and strong versions (ADR 0063, B255) must register.
      - name: Headless Fabric server check (sample mod)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-mod/msm_sample_mod.jar"
          --facts "$RUNNER_TEMP/sample-mod/fabric-facts.json"
          --expect-line '[msm_runtime] registered 3 potion(s)'
          --work "$RUNNER_TEMP/fabric-server"
          --cache ~/.cache/msm-fabric-server
      # The start-up lines are pinned as they end in the server log (the facts already require
      # the block, item and entity counts).
      - name: Headless Fabric server check (sample mob)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-mob/msm_sample_mob.jar"
          --facts "$RUNNER_TEMP/sample-mob/fabric-facts.json"
          --expect-line '[msm_runtime] registered 4 sound event(s)'
          --expect-line '[msm_runtime] registered 0 block(s) and 1 item(s) from 1 definition file(s); 0 error(s), 0 warning(s)'
          --expect-line '[msm_runtime] registered 1 entity type(s) and 0 mob effect(s)'
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      - name: Headless Fabric server check (sample creatures)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-creatures/msm_sample_creatures.jar"
          --facts "$RUNNER_TEMP/sample-creatures/fabric-facts.json"
          --expect-line '[msm_runtime] registered 0 block(s) and 7 item(s) from 7 definition file(s); 0 error(s), 0 warning(s)'
          --expect-line '[msm_runtime] registered 6 entity type(s) and 0 mob effect(s)'
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      # Each container and machine registers a block entity type under its block id, and each
      # machine its own recipe type (ADR 0075 D2).
      - name: Headless Fabric server check (sample machines)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-machines/msm_sample_machines.jar"
          --facts "$RUNNER_TEMP/sample-machines/fabric-facts.json"
          --expect-line '[msm_runtime] registered 9 block(s) and 9 item(s) from 9 definition file(s); 0 error(s), 0 warning(s)'
          --expect-line '[msm_runtime] registered 9 block entity type(s) and 3 machine recipe type(s)'
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      # The three portals register, and the project dimension is a level of this world: a
      # portal whose destination is not one logs "is not a level of this world" at start.
      - name: Headless Fabric server check (sample portals)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-portals/msm_sample_portals.jar"
          --facts "$RUNNER_TEMP/sample-portals/fabric-facts.json"
          --expect-line '[msm_runtime] registered 3 portal block(s)'
          --expect-line '[msm_runtime] registered 5 block(s) and 3 item(s) from 6 definition file(s); 0 error(s), 0 warning(s)'
          --forbid-line 'is not a level of this world'
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      # The three particle types register; a dedicated server loads no client class (the
      # particle providers and ambient particles are client code, ADR 0080 D4, D6). The facts'
      # expectScripts makes the script load required.
      - name: Headless Fabric server check (sample particles)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-particles/msm_sample_particles.jar"
          --facts "$RUNNER_TEMP/sample-particles/fabric-facts.json"
          --expect-line '[msm_runtime] registered 3 particle type(s)'
          --expect-line '[msm_runtime] registered 2 block(s) and 5 item(s) from 9 definition file(s); 0 error(s), 0 warning(s)'
          --forbid-line NoClassDefFoundError
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      # The sample rules (B381); the facts' expectScripts makes "loaded 3 script(s); 0 error(s)"
      # required. Dev mode (ADR 0084 D4, B369) is for the managed singleplayer test world only: a
      # dedicated server started with a valid msm-dev/ folder (dev.json naming this world, an event
      # overlay, a script overlay and a setup function) must not turn it on, so none of the dev
      # lines may appear and the server writes nothing into msm-dev/. "msm-dev" itself is not
      # forbidden (Java echoes JAVA_TOOL_OPTIONS); the folder is removed again afterwards.
      - name: Headless Fabric server check (sample rules, dev mode stays off on a dedicated server)
        run: |
          dev="$RUNNER_TEMP/fabric-server-mob/msm-dev"
          trap 'rm -rf "$dev"' EXIT
          rm -rf "$dev"
          mkdir -p "$dev/overlay/msm/msm_sample_rules/block" "$dev/overlay/msm/msm_sample_rules/script"
          printf '%s\n' '{"appVersion":"1.4.0","format":1,"namespaces":["msm_sample_rules"],"target":"mc-${{ matrix.mc }}","world":"world"}' > "$dev/dev.json"
          unzip -p "$RUNNER_TEMP/sample-rules/msm_sample_rules.jar" msm/msm_sample_rules/block/chime_block.json \
            > "$dev/overlay/msm/msm_sample_rules/block/chime_block.json"
          printf '%s\n' 'msm.log.info("overlay script ran");' > "$dev/overlay/msm/msm_sample_rules/script/overlay_probe.js"
          printf '%s\n' '# msm:setup' 'say the dev setup ran' '# msm:refill' 'say the dev refill ran' > "$dev/setup.mcfunction"
          (cd "$dev" && find . -type f | sort) > "$RUNNER_TEMP/msm-dev-before.txt"
          node tools/run-fabric-server/index.ts \
            --jar "$RUNNER_TEMP/sample-rules/msm_sample_rules.jar" \
            --facts "$RUNNER_TEMP/sample-rules/fabric-facts.json" \
            --expect-line '[msm_runtime] registered 2 block(s) and 5 item(s) from 5 definition file(s); 0 error(s), 0 warning(s)' \
            --expect-line '[msm_runtime] registered 1 entity type(s) and 0 mob effect(s)' \
            --forbid-line 'dev mode for' --forbid-line 'dev overlay' --forbid-line 'dev setup' \
            --forbid-line 'not a valid dev file' --forbid-line 'overlay script ran' --forbid-line 'the dev refill ran' \
            --work "$RUNNER_TEMP/fabric-server-mob" \
            --cache ~/.cache/msm-fabric-server
          (cd "$dev" && find . -type f | sort) | diff "$RUNNER_TEMP/msm-dev-before.txt" -
      # The sample vehicles (B426): the seven vehicle types, two key binds and four HUD elements
      # register (the facts' expectScripts makes "loaded 1 script(s); 0 error(s)" required), and a
      # dedicated server loads no client class (the vehicle renderer, model, engine sound, input
      # and HUD drawing are client code, B416, B418).
      - name: Headless Fabric server check (sample vehicles)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-vehicles/msm_sample_vehicles.jar"
          --facts "$RUNNER_TEMP/sample-vehicles/fabric-facts.json"
          --expect-line '[msm_runtime] registered 7 vehicle type(s)'
          --expect-line '[msm_runtime] registered 2 key bind(s)'
          --expect-line '[msm_runtime] registered 4 HUD element(s)'
          --expect-line '[msm_runtime] registered 0 block(s) and 2 item(s) from 15 definition file(s); 0 error(s), 0 warning(s)'
          --forbid-line NoClassDefFoundError
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      # The sample vanilla blocks (B464, B462b): the twenty types, the conveyor, both commands and the
      # tabs register, the Script API 1.6 script and the rule book's script load (the facts'
      # expectScripts also requires the line), and the runtime's Mixins (B455) apply: a failed Mixin
      # is an error at start, and a dedicated server loads no client class. The explosion Mixin loads
      # at the first explosion, which the script's World.explode at server.started makes, so a plain
      # start applies it too.
      - name: Headless Fabric server check (sample vanilla blocks)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-vanilla-blocks/msm_sample_vanilla_blocks.jar"
          --facts "$RUNNER_TEMP/sample-vanilla-blocks/fabric-facts.json"
          --expect-line '[msm_runtime] registered 31 block(s) and 34 item(s) from 39 definition file(s); 0 error(s), 0 warning(s)'
          --expect-line '[msm_runtime] registered blocks by type: block 10, horizontal 1, cake 1, berry_bush 1, tall_plant 1, potted_plant 1, vine 1, sea_pickle 1, carpet 1, layers 1, cocoa 1, candle 1, bed 1, ladder 1, torch 1, lantern 1, chain 1, rod 1, sign 1, hanging_sign 1, stem 1, scaffolding 1'
          --expect-line '[msm_runtime] registered 2 command(s)'
          --expect-line '[msm_runtime] registered 2 creative tab(s)'
          --expect-line '[msm_runtime] loaded 2 script(s); 0 error(s)'
          --forbid-line NoClassDefFoundError
          --forbid-line 'Mixin apply'
          --forbid-line MixinTransformerError
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      # The sample villagers and fluids (B482): the bench, the three mobs and their eggs, the two
      # fluids (with their liquid blocks and buckets) and the glassblower register (7 definition
      # files), the Glow Moon is a level of the world (its chunks are saved at the stop), the 26.4
      # fluid Mixin applies, and a dedicated server loads no client class (the fluid renderers are
      # client code, B475).
      - name: Headless Fabric server check (sample villagers and fluids)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-villagers/msm_sample_villagers.jar"
          --facts "$RUNNER_TEMP/sample-villagers/fabric-facts.json"
          --expect-line '[msm_runtime] registered 1 block(s) and 4 item(s) from 7 definition file(s); 0 error(s), 0 warning(s)'
          --expect-line '[msm_runtime] registered 3 entity type(s) and 0 mob effect(s)'
          --expect-line '[msm_runtime] registered 2 fluid(s)'
          --expect-line '[msm_runtime] registered 1 villager profession(s)'
          --expect-line "Saving chunks for level 'ServerLevel[world]'/msm_sample_villagers:glow_moon"
          --forbid-line NoClassDefFoundError
          --forbid-line 'Mixin apply'
          --forbid-line MixinTransformerError
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      # The sample plants and storage (B520): the 40 blocks (the companions are not counted) and 39
      # items register, the six chests get their block entity types, the pot its three potted
      # plants, the rules file its six rules, and on 26.4 every own sound has its block_sound_set
      # entry (a missing one is logged at each world start); a dedicated server loads no client class.
      - name: Headless Fabric server check (sample plants and storage)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-plants/msm_sample_plants.jar"
          --facts "$RUNNER_TEMP/sample-plants/fabric-facts.json"
          --expect-line '[msm_runtime] registered 40 block(s) and 39 item(s) from 41 definition file(s); 0 error(s), 0 warning(s)'
          --expect-line '[msm_runtime] registered blocks by type: block 6, horizontal 4, wall 3, fence 3, fence_gate 3, door 1, button 3, pressure_plate 3, potted_plant 1, rod 3, growing_plant 3, column_plant 3, multiface 1, dripleaf 2, flower_pot 1'
          --expect-line '[msm_runtime] registered 6 block entity type(s) and 0 machine recipe type(s)'
          --expect-line '[msm_runtime] pot msm_sample_plants:clay_planter: registered 3 potted plant(s) of 3 listed; 0 wait for their plant'
          --expect-line '[msm_runtime] registered 6 vanilla block rule(s) from 1 file(s)'
          --forbid-line 'so the block makes no sound'
          --forbid-line NoClassDefFoundError
          --forbid-line 'Mixin apply'
          --forbid-line MixinTransformerError
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      # Phase 6 (B139): scripts on a real server, the Java project eject built with Gradle, and
      # the behaviour-parity GameTests run against both the content jar and the ejected jar.
      - name: Export the sample script with the real runtime
        run: |
          MSM_SAMPLE_SCRIPT_OUT="$RUNNER_TEMP/sample-script" \
            pnpm --filter @msm/exporters exec vitest run test/sample-script.golden.test.ts
          test -f "$RUNNER_TEMP/sample-script/msm_sample_script.jar"
          cat "$RUNNER_TEMP/sample-script/fabric-facts.json"
      # Reuses the sample mod's run folder (the game server is already there); the facts'
      # expectScripts makes "[msm_runtime] loaded S script(s); 0 error(s)" required. Two starts
      # on one world (ADR 0062): the start_counter script counts the starts in msm.storage,
      # saved with the world, so the second start must log "start counter: 2".
      - name: Headless Fabric server check (sample script, scripts loaded, two starts)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-script/msm_sample_script.jar"
          --facts "$RUNNER_TEMP/sample-script/fabric-facts.json"
          --runs 2 --expect-line 'msm_sample_script:start_counter: start counter: {run}'
          --work "$RUNNER_TEMP/fabric-server"
          --cache ~/.cache/msm-fabric-server
      # The sample data pack's villager trade (B231) on a vanilla dedicated server: no Fabric and
      # no runtime, since the trade is plain data. Zombie-converted fletchers must offer the new
      # trade and still the vanilla arrow trade (both counts above zero). Since B255 it also
      # loads the wolf variant, the goat horn instrument with its tag and recipe and a brewing
      # recipe of vanilla potions with no load error, and finds a wolf of the variant and a horn
      # of the call again by their ids (so both are in their registries).
      - name: Export the sample data pack
        run: |
          MSM_SAMPLE_DATAPACK_OUT="$RUNNER_TEMP/sample-datapack" \
            pnpm --filter @msm/exporters exec vitest run test/sample-datapack.golden.test.ts
          cat "$RUNNER_TEMP/sample-datapack/server-facts.json"
      - name: Headless vanilla server check (sample data pack, villager trade, wolf variant, goat horn)
        run: >-
          node tools/run-fabric-server/vanilla-datapack.ts
          --facts "$RUNNER_TEMP/sample-datapack/server-facts.json"
          --work "$RUNNER_TEMP/vanilla-datapack"
          --cache ~/.cache/msm-fabric-server
      # Every library starter (defaults, wizard answers, minimums), example and examples/ mirror
      # project is exported for this target as the app's vanilla data pack export does it (with
      # msm: kinds, potions are left out and the vanilla pack safety rule of ADR 0066 leaves out
      # files naming mod-only ids) and loaded into one vanilla server world (more only where two
      # packs write the same file): the server must start (one bad registry file stops it), drop
      # no tag or function (but the ones the rule warned about) and list every pack as enabled.
      # A failure is bisected down to the pack, its source and its files
      # (tools/run-fabric-server/vanilla-packs.ts).
      - name: Export the library's vanilla data packs
        run: |
          MSM_LIBRARY_PACKS_OUT="$RUNNER_TEMP/library-packs" \
            pnpm --filter @msm/exporters exec vitest run test/library.test.ts -t "vanilla server data packs"
          node -e 'const f = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); console.log(`${f.packs.length} packs (${f.packs.filter((p) => p.mod).length} with mod content) for Minecraft ${f.minecraft}`); if (f.packs.length === 0) process.exit(1);' "$RUNNER_TEMP/library-packs/packs.json"
      - name: Headless vanilla server check (library data packs)
        run: >-
          node tools/run-fabric-server/vanilla-packs.ts
          --packs "$RUNNER_TEMP/library-packs/packs.json"
          --work "$RUNNER_TEMP/vanilla-packs"
          --cache ~/.cache/msm-fabric-server
      - name: Build the parity GameTests
        working-directory: engine-mod
        run: |
          ./gradlew -p parity build -Pmc=${{ matrix.mc }} --no-daemon
          mapfile -t jars < <(ls "$GITHUB_WORKSPACE"/engine-mod/parity/build/libs/msm_parity_tests-*+mc${{ matrix.mc }}.jar | grep -v -e '-sources\.jar$')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected one msm_parity_tests +mc${{ matrix.mc }} jar, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          echo "MSM_PARITY_JAR=${jars[0]}" >> "$GITHUB_ENV"
      # The Java project eject and the ejected parity runs: 26.3 only until the other versions'
      # Java generators are confirmed (ADR 0038 D5).
      - name: Export the sample mod, the sample mob, the sample creatures, the sample machines, the sample portals, the sample particles and the sample rules as Java projects
        if: matrix.mc == '26.3'
        run: |
          MSM_SAMPLE_MOD_JAVA_OUT="$RUNNER_TEMP/java/sample-mod" \
            pnpm --filter @msm/exporters exec vitest run test/sample-mod.java.golden.test.ts
          MSM_SAMPLE_MOB_JAVA_OUT="$RUNNER_TEMP/java/sample-mob" \
            pnpm --filter @msm/exporters exec vitest run test/sample-mob.java.golden.test.ts
          MSM_SAMPLE_CREATURES_JAVA_OUT="$RUNNER_TEMP/java/sample-creatures" \
            pnpm --filter @msm/exporters exec vitest run test/sample-creatures.java.golden.test.ts
          MSM_SAMPLE_MACHINES_JAVA_OUT="$RUNNER_TEMP/java/sample-machines" \
            pnpm --filter @msm/exporters exec vitest run test/sample-machines.java.golden.test.ts
          MSM_SAMPLE_PORTALS_JAVA_OUT="$RUNNER_TEMP/java/sample-portals" \
            pnpm --filter @msm/exporters exec vitest run test/sample-portals.java.golden.test.ts
          MSM_SAMPLE_PARTICLES_JAVA_OUT="$RUNNER_TEMP/java/sample-particles" \
            pnpm --filter @msm/exporters exec vitest run test/sample-particles.java.golden.test.ts
          MSM_SAMPLE_RULES_JAVA_OUT="$RUNNER_TEMP/java/sample-rules" \
            pnpm --filter @msm/exporters exec vitest run test/sample-rules.java.golden.test.ts
          test -x "$RUNNER_TEMP/java/sample-mod/gradlew"
          test -x "$RUNNER_TEMP/java/sample-mob/gradlew"
          test -x "$RUNNER_TEMP/java/sample-creatures/gradlew"
          test -x "$RUNNER_TEMP/java/sample-machines/gradlew"
          test -x "$RUNNER_TEMP/java/sample-portals/gradlew"
          test -x "$RUNNER_TEMP/java/sample-particles/gradlew"
          test -x "$RUNNER_TEMP/java/sample-rules/gradlew"
      # Each written project builds with its own wrapper; the Gradle cache above holds the 26.3
      # artefacts. Loom's "(kSxHvs99) is not valid semver" line for the nested GeckoLib is harmless.
      - name: Build the ejected sample mod
        if: matrix.mc == '26.3'
        working-directory: ${{ runner.temp }}/java/sample-mod
        run: ./gradlew build --no-daemon
      - name: Build the ejected sample mob
        if: matrix.mc == '26.3'
        working-directory: ${{ runner.temp }}/java/sample-mob
        run: ./gradlew build --no-daemon
      - name: Build the ejected sample creatures
        if: matrix.mc == '26.3'
        working-directory: ${{ runner.temp }}/java/sample-creatures
        run: ./gradlew build --no-daemon
      - name: Build the ejected sample machines
        if: matrix.mc == '26.3'
        working-directory: ${{ runner.temp }}/java/sample-machines
        run: ./gradlew build --no-daemon
      - name: Build the ejected sample portals
        if: matrix.mc == '26.3'
        working-directory: ${{ runner.temp }}/java/sample-portals
        run: ./gradlew build --no-daemon
      - name: Build the ejected sample particles
        if: matrix.mc == '26.3'
        working-directory: ${{ runner.temp }}/java/sample-particles
        run: ./gradlew build --no-daemon
      # The plain rules only (Chime Block, Sentinel): the generated scripts and their run_script
      # events are left out of the eject (export.scripts-not-ejected).
      - name: Build the ejected sample rules
        if: matrix.mc == '26.3'
        working-directory: ${{ runner.temp }}/java/sample-rules
        run: ./gradlew build --no-daemon
      - name: Find the ejected jars
        if: matrix.mc == '26.3'
        run: |
          for sample in mod mob creatures machines portals particles rules; do
            mapfile -t jars < <(ls "$RUNNER_TEMP/java/sample-$sample"/build/libs/msm_sample_$sample-*.jar | grep -v -e '-sources\.jar$')
            if [ "${#jars[@]}" -ne 1 ]; then
              echo "::error::Expected one ejected sample-$sample jar, found ${#jars[@]}: ${jars[*]}"
              exit 1
            fi
            echo "Ejected sample-$sample jar: ${jars[0]}"
            echo "MSM_EJECTED_${sample^^}_JAR=${jars[0]}" >> "$GITHUB_ENV"
          done
      # The sample vanilla blocks as a Java project (B457, B464): the twenty types' drivers, the
      # companions, waxing, the bags, the commands and the tab, generated and built for 26.3.
      - name: Export the sample vanilla blocks as a Java project
        if: matrix.mc == '26.3'
        run: |
          MSM_SAMPLE_VANILLA_BLOCKS_JAVA_OUT="$RUNNER_TEMP/java/sample-vanilla-blocks" \
            pnpm --filter @msm/exporters exec vitest run test/sample-vanilla-blocks.java.golden.test.ts
          test -x "$RUNNER_TEMP/java/sample-vanilla-blocks/gradlew"
      - name: Build the ejected sample vanilla blocks
        if: matrix.mc == '26.3'
        working-directory: ${{ runner.temp }}/java/sample-vanilla-blocks
        run: ./gradlew build --no-daemon
      - name: Find the ejected sample vanilla blocks jar
        if: matrix.mc == '26.3'
        run: |
          mapfile -t jars < <(ls "$RUNNER_TEMP/java/sample-vanilla-blocks"/build/libs/msm_sample_vanilla_blocks-*.jar | grep -v -e '-sources\.jar$')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected one ejected sample-vanilla-blocks jar, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          echo "Ejected sample-vanilla-blocks jar: ${jars[0]}"
          echo "MSM_EJECTED_VANILLA_BLOCKS_JAR=${jars[0]}" >> "$GITHUB_ENV"
      # The ejected jar starts without msm_runtime; no client class may load on a dedicated server.
      - name: Headless Fabric server check (ejected sample vanilla blocks)
        if: matrix.mc == '26.3'
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$MSM_EJECTED_VANILLA_BLOCKS_JAR"
          --facts "$RUNNER_TEMP/sample-vanilla-blocks/fabric-facts.json" --no-runtime
          --forbid-line NoClassDefFoundError
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      # The sample plants and storage as a Java project (B517, B520): the plant drivers, the pot,
      # bronze on the six types with lightning, the chests, own sounds and set types, flatten and
      # till, generated and built for 26.3. The rules for vanilla blocks are not ejected yet.
      - name: Export the sample plants and storage as a Java project
        if: matrix.mc == '26.3'
        run: |
          MSM_SAMPLE_PLANTS_JAVA_OUT="$RUNNER_TEMP/java/sample-plants" \
            pnpm --filter @msm/exporters exec vitest run test/sample-plants-and-storage.java.golden.test.ts
          test -x "$RUNNER_TEMP/java/sample-plants/gradlew"
      - name: Build the ejected sample plants and storage
        if: matrix.mc == '26.3'
        working-directory: ${{ runner.temp }}/java/sample-plants
        run: ./gradlew build --no-daemon
      - name: Find the ejected sample plants and storage jar
        if: matrix.mc == '26.3'
        run: |
          mapfile -t jars < <(ls "$RUNNER_TEMP/java/sample-plants"/build/libs/msm_sample_plants-*.jar | grep -v -e '-sources\.jar$')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected one ejected sample-plants jar, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          echo "Ejected sample-plants jar: ${jars[0]}"
          echo "MSM_EJECTED_PLANTS_JAR=${jars[0]}" >> "$GITHUB_ENV"
      # The ejected jar starts without msm_runtime; no client class may load on a dedicated server.
      - name: Headless Fabric server check (ejected sample plants and storage)
        if: matrix.mc == '26.3'
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$MSM_EJECTED_PLANTS_JAR"
          --facts "$RUNNER_TEMP/sample-plants/fabric-facts.json" --no-runtime
          --forbid-line NoClassDefFoundError
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      # The ejected portals start without msm_runtime and load sky_realm: the generated mod logs
      # "[msm_sample_portals] portal ...: dimension ... is not a level of this world" otherwise.
      - name: Headless Fabric server check (ejected sample portals)
        if: matrix.mc == '26.3'
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$MSM_EJECTED_PORTALS_JAR"
          --facts "$RUNNER_TEMP/sample-portals/fabric-facts.json" --no-runtime
          --forbid-line 'is not a level of this world'
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      # The ejected particles' client classes (ModParticle, its provider, ambient particles) must
      # never load on a dedicated server (B355).
      - name: Headless Fabric server check (ejected sample particles)
        if: matrix.mc == '26.3'
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$MSM_EJECTED_PARTICLES_JAR"
          --facts "$RUNNER_TEMP/sample-particles/fabric-facts.json" --no-runtime
          --forbid-line NoClassDefFoundError
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      # The ejected rules start without msm_runtime; the Java project draws the Sentinel with
      # GeckoLib (the eject has no vanilla renderer), so GeckoLib (cached by the mob export) goes
      # into mods/ beside it.
      - name: Headless Fabric server check (ejected sample rules)
        if: matrix.mc == '26.3'
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$MSM_EJECTED_RULES_JAR"
          --facts "$RUNNER_TEMP/sample-rules/fabric-facts.json" --no-runtime
          --extra ~/.cache/msm-fabric-server/geckolib.jar
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      # The parity runs share one run folder (the game server is downloaded once); each writes
      # its own report. The filter picks the sample's tests from the one parity jar. The sample
      # mod runs include the potion tests (SampleModPotionParityTest, B255) on the content jar of
      # every version and on the ejected jar.
      - name: Parity GameTests (sample mod, content jar)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-mod/msm_sample_mod.jar"
          --facts "$RUNNER_TEMP/sample-mod/fabric-facts.json"
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_mod_*'
          --report "$RUNNER_TEMP/parity-reports/sample-mod-content.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      - name: Parity GameTests (sample mod, ejected jar)
        if: matrix.mc == '26.3'
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$MSM_EJECTED_MOD_JAR"
          --facts "$RUNNER_TEMP/sample-mod/fabric-facts.json" --no-runtime
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_mod_*'
          --report "$RUNNER_TEMP/parity-reports/sample-mod-ejected.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      - name: Parity GameTests (sample mob, content jar)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-mob/msm_sample_mob.jar"
          --facts "$RUNNER_TEMP/sample-mob/fabric-facts.json"
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_mob_*'
          --report "$RUNNER_TEMP/parity-reports/sample-mob-content.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      - name: Parity GameTests (sample mob, ejected jar)
        if: matrix.mc == '26.3'
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$MSM_EJECTED_MOB_JAR"
          --facts "$RUNNER_TEMP/sample-mob/fabric-facts.json" --no-runtime
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_mob_*'
          --report "$RUNNER_TEMP/parity-reports/sample-mob-ejected.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      # The mob expansion (B306, SampleCreaturesParityTest): bodies, taming, breeding, riding,
      # movement, ranged attacks, variants and the boss bar, black-box, on the content jar of
      # every version (26.4 without GeckoLib) and on the ejected jar.
      - name: Parity GameTests (sample creatures, content jar)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-creatures/msm_sample_creatures.jar"
          --facts "$RUNNER_TEMP/sample-creatures/fabric-facts.json"
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_creatures_*'
          --report "$RUNNER_TEMP/parity-reports/sample-creatures-content.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      - name: Parity GameTests (sample creatures, ejected jar)
        if: matrix.mc == '26.3'
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$MSM_EJECTED_CREATURES_JAR"
          --facts "$RUNNER_TEMP/sample-creatures/fabric-facts.json" --no-runtime
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_creatures_*'
          --report "$RUNNER_TEMP/parity-reports/sample-creatures-ejected.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      # Containers and machines (B325, SampleMachinesParityTest): menus, commands, hoppers,
      # comparators, breaking, keeping the contents, the holder, loot tables, fuel, smelting and
      # redstone machines, the furnace menu, experience and the event lines, black-box, on the
      # content jar of every version and on the ejected jar.
      - name: Parity GameTests (sample machines, content jar)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-machines/msm_sample_machines.jar"
          --facts "$RUNNER_TEMP/sample-machines/fabric-facts.json"
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_machines_*'
          --report "$RUNNER_TEMP/parity-reports/sample-machines-content.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      - name: Parity GameTests (sample machines, ejected jar)
        if: matrix.mc == '26.3'
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$MSM_EJECTED_MACHINES_JAR"
          --facts "$RUNNER_TEMP/sample-machines/fabric-facts.json" --no-runtime
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_machines_*'
          --report "$RUNNER_TEMP/parity-reports/sample-machines-ejected.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      # Custom portals (B343, SamplePortalsParityTest): lighting on both axes, wrong items and
      # frames, the igniter's durability, putting a portal out, no loot, an item and a cow to the
      # Nether at 1/8 into a gold exit and the way back, the beacon's light_portal and players
      # only, black-box, on the content jar of every version and on the ejected jar. The GameTest
      # server makes no level of a data pack dimension (limit P8), so the runtime warns that
      # sky_realm is missing and the tests check that nobody goes there; --allow-line lets only
      # that warning pass (the ejected mod logs it under its own id, which is not checked).
      - name: Parity GameTests (sample portals, content jar)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-portals/msm_sample_portals.jar"
          --facts "$RUNNER_TEMP/sample-portals/fabric-facts.json"
          --allow-line 'dimension msm_sample_portals:sky_realm is not a level of this world'
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_portals_*'
          --report "$RUNNER_TEMP/parity-reports/sample-portals-content.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      - name: Parity GameTests (sample portals, ejected jar)
        if: matrix.mc == '26.3'
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$MSM_EJECTED_PORTALS_JAR"
          --facts "$RUNNER_TEMP/sample-portals/fabric-facts.json" --no-runtime
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_portals_*'
          --report "$RUNNER_TEMP/parity-reports/sample-portals-ejected.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      # Custom particles (B359, SampleParticlesParityTest): the three types registered without
      # options (bubble overriding the limiter), /particle and /function packets, the stream codec,
      # the wands' moving sparks and dust, the held charm's forced petals, glimmer's bubble and no
      # packet for ambient particles (client only), black-box, on the content jar of every version
      # and on the ejected jar. The script's test (SampleParticlesScriptParityTest) runs on the
      # content jar only: sample_particles_* matches both classes, sample_particles_parity_test_*
      # only the first.
      - name: Parity GameTests (sample particles, content jar)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-particles/msm_sample_particles.jar"
          --facts "$RUNNER_TEMP/sample-particles/fabric-facts.json"
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_particles_*'
