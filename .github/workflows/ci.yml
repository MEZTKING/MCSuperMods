name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node app/node_modules/electron/install.js
      - run: xvfb-run -a pnpm --filter @msm/app smoke
      - run: xvfb-run -a pnpm --filter @msm/app e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: app/e2e/output
          if-no-files-found: ignore
      - run: pnpm --filter @msm/app dist:dir
      - run: xvfb-run -a pnpm --filter @msm/app smoke:packaged
      - run: node tools/check-size/index.ts

  # The external plugin build on Windows: `fixtures/sample-plugin/build.ts` runs the same steps
  # that `tools/new-plugin --external` writes for plugin authors, whose machines are mostly
  # Windows (drive-letter file URLs, `\` paths).
  windows-plugin:
    runs-on: windows-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @msm/sample-plugin...
      - run: pnpm --filter @msm/sample-plugin build
      - name: Check the schema export
        shell: bash
        run: |
          node -e 'const s = JSON.parse(require("node:fs").readFileSync("fixtures/sample-plugin/dist/symbols.json", "utf8")); const n = Object.keys(s.mcdoc).length; console.log(`${n} type(s)`); if (n === 0) process.exit(1);'

  # The msm_runtime Fabric mod (ADR 0024, ADR 0026 D6), once per Minecraft version (ADR 0038 D5):
  # JUnit and GameTests through `./gradlew build -Pmc=<mc>`, then the samples exported for target
  # mc-<mc> with that runtime nested and started on a headless Fabric dedicated server
  # (tools/run-fabric-server; the sample script twice on one world), and the sample data pack on
  # a vanilla server (tools/run-fabric-server/vanilla-datapack.ts). 26.3 also builds the ejected
  # Java projects and runs the five parity runs; other versions run parity on the content jars
  # only (the sample mob only with GeckoLib).
  # Action versions: setup-java and cache v6 (checked 2026-11-05).
  engine-mod:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per engine-mod/versions/<mc>.properties: that folder is the source of these
        # literals (check-deps does not scan workflow files). The 26.3 entry runs everything.
        mc: ["26.3", "26.4"]
    env:
      CI: true
      # The exporter golden tests export the samples for this target (B153).
      MSM_TARGET_ID: mc-${{ matrix.mc }}
    steps:
      # A full checkout: the JUnit corpus test reads packages/schemas/mcdoc/msm/conformance/
      # relative to engine-mod/, so both folders must stay side by side.
      - uses: actions/checkout@v7
      - name: Read the version facts
        id: facts
        run: |
          file="engine-mod/versions/${{ matrix.mc }}.properties"
          if [ ! -f "$file" ]; then
            echo "::error::No $file for matrix entry ${{ matrix.mc }}"
            exit 1
          fi
          minecraft=$(sed -n 's/^minecraft_version=//p' "$file" | tr -d '[:space:]')
          geckolib_id=$(sed -n 's/^geckolib_modrinth_version_id=//p' "$file" | tr -d '[:space:]')
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
          if [ -n "$geckolib_id" ]; then echo "geckolib=true" >> "$GITHUB_OUTPUT"; else echo "geckolib=false" >> "$GITHUB_OUTPUT"; fi
          echo "Minecraft $minecraft, GeckoLib id '${geckolib_id}'"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-mc${{ matrix.mc }}-${{ hashFiles('engine-mod/*.gradle.kts', 'engine-mod/parity/*.gradle.kts', 'engine-mod/gradle.properties', 'engine-mod/parity/gradle.properties', 'engine-mod/versions/*.properties', 'engine-mod/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-mc${{ matrix.mc }}-
      - name: Build msm_runtime (JUnit and GameTests)
        working-directory: engine-mod
        run: ./gradlew build -Pmc=${{ matrix.mc }} --no-daemon
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Restored before the exports: the sample-mob export downloads GeckoLib into this cache
      # (from the target's GeckoLib facts, SHA-512 checked) when it is missing.
      # The key names GeckoLib so caches saved before it was added are not reused.
      # The key names the vanilla server too (B241), so a cache saved before the data pack check
      # is not reused without it.
      - name: Cache Fabric server, vanilla server and GeckoLib downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/msm-fabric-server
          key: fabric-server-geckolib-vanilla-mc${{ matrix.mc }}-${{ hashFiles('packages/targets/*/src/target.ts') }}
      - name: Find the msm_runtime jar
        run: |
          mapfile -t jars < <(ls "$GITHUB_WORKSPACE"/engine-mod/build/libs/msm_runtime-*+mc${{ matrix.mc }}.jar | grep -v -e '-sources\.jar$' -e '-dev\.jar$')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected one msm_runtime +mc${{ matrix.mc }} jar in engine-mod/build/libs, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          echo "Runtime jar: ${jars[0]}"
          echo "MSM_RUNTIME_JAR=${jars[0]}" >> "$GITHUB_ENV"
      - name: Export the sample mod with the real runtime
        run: |
          MSM_SAMPLE_MOD_OUT="$RUNNER_TEMP/sample-mod" \
            pnpm --filter @msm/exporters exec vitest run test/sample-mod.golden.test.ts
          test -f "$RUNNER_TEMP/sample-mod/msm_sample_mod.jar"
          cat "$RUNNER_TEMP/sample-mod/fabric-facts.json"
      # The facts file comes from the target (MSM_TARGET_ID); its game version must be the one
      # this runtime was built against, or the server below would start the wrong game.
      - name: Check the facts name this Minecraft version
        run: |
          actual=$(node -p 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).minecraft' "$RUNNER_TEMP/sample-mod/fabric-facts.json")
          if [ "$actual" != "${{ steps.facts.outputs.minecraft }}" ]; then
            echo "::error::fabric-facts.json names Minecraft $actual, engine-mod/versions/${{ matrix.mc }}.properties ${{ steps.facts.outputs.minecraft }} (is MSM_TARGET_ID honoured?)"
            exit 1
          fi
      - name: Export the sample mob with the real runtime and GeckoLib
        if: steps.facts.outputs.geckolib == 'true'
        run: |
          MSM_GECKOLIB_JAR="$HOME/.cache/msm-fabric-server/geckolib.jar" MSM_SAMPLE_MOB_OUT="$RUNNER_TEMP/sample-mob" \
            pnpm --filter @msm/exporters exec vitest run test/sample-mob.golden.test.ts
          test -f "$RUNNER_TEMP/sample-mob/msm_sample_mob.jar"
          cat "$RUNNER_TEMP/sample-mob/fabric-facts.json"
      - name: Sample mob skipped (no GeckoLib for this version)
        if: steps.facts.outputs.geckolib != 'true'
        run: echo "::notice::No GeckoLib build for Minecraft ${{ matrix.mc }} (blank geckolib_modrinth_version_id in engine-mod/versions/${{ matrix.mc }}.properties); the sample mob export, server check and parity runs are skipped."
      - name: Headless Fabric server check (sample mod)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-mod/msm_sample_mod.jar"
          --facts "$RUNNER_TEMP/sample-mod/fabric-facts.json"
          --work "$RUNNER_TEMP/fabric-server"
          --cache ~/.cache/msm-fabric-server
      - name: Headless Fabric server check (sample mob, GeckoLib nested)
        if: steps.facts.outputs.geckolib == 'true'
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-mob/msm_sample_mob.jar"
          --facts "$RUNNER_TEMP/sample-mob/fabric-facts.json"
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      # Phase 6 (B139): scripts on a real server, the Java project eject built with Gradle, and
      # the behaviour-parity GameTests run against both the content jar and the ejected jar.
      - name: Export the sample script with the real runtime
        run: |
          MSM_SAMPLE_SCRIPT_OUT="$RUNNER_TEMP/sample-script" \
            pnpm --filter @msm/exporters exec vitest run test/sample-script.golden.test.ts
          test -f "$RUNNER_TEMP/sample-script/msm_sample_script.jar"
          cat "$RUNNER_TEMP/sample-script/fabric-facts.json"
      # Reuses the sample mod's run folder (the game server is already there); the facts'
      # expectScripts makes "[msm_runtime] loaded S script(s); 0 error(s)" required. Two starts
      # on one world (ADR 0062): the start_counter script counts the starts in msm.storage,
      # saved with the world, so the second start must log "start counter: 2".
      - name: Headless Fabric server check (sample script, scripts loaded, two starts)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-script/msm_sample_script.jar"
          --facts "$RUNNER_TEMP/sample-script/fabric-facts.json"
          --runs 2 --expect-line 'msm_sample_script:start_counter: start counter: {run}'
          --work "$RUNNER_TEMP/fabric-server"
          --cache ~/.cache/msm-fabric-server
      # The sample data pack's villager trade (B231) on a vanilla dedicated server: no Fabric and
      # no runtime, since the trade is plain data. Zombie-converted fletchers must offer the new
      # trade and still the vanilla arrow trade (both counts above zero).
      - name: Export the sample data pack
        run: |
          MSM_SAMPLE_DATAPACK_OUT="$RUNNER_TEMP/sample-datapack" \
            pnpm --filter @msm/exporters exec vitest run test/sample-datapack.golden.test.ts
          cat "$RUNNER_TEMP/sample-datapack/server-facts.json"
      - name: Headless vanilla server check (sample data pack, villager trade)
        run: >-
          node tools/run-fabric-server/vanilla-datapack.ts
          --facts "$RUNNER_TEMP/sample-datapack/server-facts.json"
          --work "$RUNNER_TEMP/vanilla-datapack"
          --cache ~/.cache/msm-fabric-server
      - name: Build the parity GameTests
        working-directory: engine-mod
        run: |
          ./gradlew -p parity build -Pmc=${{ matrix.mc }} --no-daemon
          mapfile -t jars < <(ls "$GITHUB_WORKSPACE"/engine-mod/parity/build/libs/msm_parity_tests-*+mc${{ matrix.mc }}.jar | grep -v -e '-sources\.jar$')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected one msm_parity_tests +mc${{ matrix.mc }} jar, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          echo "MSM_PARITY_JAR=${jars[0]}" >> "$GITHUB_ENV"
      # The Java project eject and the ejected parity runs: 26.3 only until the other versions'
      # Java generators are confirmed (ADR 0038 D5).
      - name: Export the sample mod and the sample mob as Java projects
        if: matrix.mc == '26.3'
        run: |
          MSM_SAMPLE_MOD_JAVA_OUT="$RUNNER_TEMP/java/sample-mod" \
            pnpm --filter @msm/exporters exec vitest run test/sample-mod.java.golden.test.ts
          MSM_SAMPLE_MOB_JAVA_OUT="$RUNNER_TEMP/java/sample-mob" \
            pnpm --filter @msm/exporters exec vitest run test/sample-mob.java.golden.test.ts
          test -x "$RUNNER_TEMP/java/sample-mod/gradlew"
          test -x "$RUNNER_TEMP/java/sample-mob/gradlew"
      # Each written project builds with its own wrapper; the Gradle cache above holds the 26.3
      # artefacts. Loom's "(kSxHvs99) is not valid semver" line for the nested GeckoLib is harmless.
      - name: Build the ejected sample mod
        if: matrix.mc == '26.3'
        working-directory: ${{ runner.temp }}/java/sample-mod
        run: ./gradlew build --no-daemon
      - name: Build the ejected sample mob
        if: matrix.mc == '26.3'
        working-directory: ${{ runner.temp }}/java/sample-mob
        run: ./gradlew build --no-daemon
      - name: Find the ejected jars
        if: matrix.mc == '26.3'
        run: |
          for sample in mod mob; do
            mapfile -t jars < <(ls "$RUNNER_TEMP/java/sample-$sample"/build/libs/msm_sample_$sample-*.jar | grep -v -e '-sources\.jar$')
            if [ "${#jars[@]}" -ne 1 ]; then
              echo "::error::Expected one ejected sample-$sample jar, found ${#jars[@]}: ${jars[*]}"
              exit 1
            fi
            echo "Ejected sample-$sample jar: ${jars[0]}"
            echo "MSM_EJECTED_${sample^^}_JAR=${jars[0]}" >> "$GITHUB_ENV"
          done
      # The parity runs share one run folder (the game server is downloaded once); each writes
      # its own report. The filter picks the sample's tests from the one parity jar.
      - name: Parity GameTests (sample mod, content jar)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-mod/msm_sample_mod.jar"
          --facts "$RUNNER_TEMP/sample-mod/fabric-facts.json"
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_mod_*'
          --report "$RUNNER_TEMP/parity-reports/sample-mod-content.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      - name: Parity GameTests (sample mod, ejected jar)
        if: matrix.mc == '26.3'
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$MSM_EJECTED_MOD_JAR"
          --facts "$RUNNER_TEMP/sample-mod/fabric-facts.json" --no-runtime
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_mod_*'
          --report "$RUNNER_TEMP/parity-reports/sample-mod-ejected.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      - name: Parity GameTests (sample mob, content jar)
        if: steps.facts.outputs.geckolib == 'true'
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-mob/msm_sample_mob.jar"
          --facts "$RUNNER_TEMP/sample-mob/fabric-facts.json"
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_mob_*'
          --report "$RUNNER_TEMP/parity-reports/sample-mob-content.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      - name: Parity GameTests (sample mob, ejected jar)
        if: matrix.mc == '26.3'
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$MSM_EJECTED_MOB_JAR"
          --facts "$RUNNER_TEMP/sample-mob/fabric-facts.json" --no-runtime
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_mob_*'
          --report "$RUNNER_TEMP/parity-reports/sample-mob-ejected.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      # The fifth run (ADR 0058 D4): script behaviour on the content jar only, since scripts
      # are not part of the Java project eject (ADR 0033).
      - name: Parity GameTests (sample script, content jar)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-script/msm_sample_script.jar"
          --facts "$RUNNER_TEMP/sample-script/fabric-facts.json"
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_script_*'
          --report "$RUNNER_TEMP/parity-reports/sample-script-content.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      # Artifact names carry the version: matrix jobs may not upload the same name twice.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msm-sample-mod-mc${{ matrix.mc }}
          path: ${{ runner.temp }}/sample-mod/msm_sample_mod.jar
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msm-sample-mob-mc${{ matrix.mc }}
          path: ${{ runner.temp }}/sample-mob/msm_sample_mob.jar
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msm-sample-script-mc${{ matrix.mc }}
          path: ${{ runner.temp }}/sample-script/msm_sample_script.jar
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msm-ejected-jars-mc${{ matrix.mc }}
          path: |
            ${{ runner.temp }}/java/sample-mod/build/libs/*.jar
            ${{ runner.temp }}/java/sample-mob/build/libs/*.jar
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-gametest-reports-mc${{ matrix.mc }}
          path: ${{ runner.temp }}/parity-reports
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: engine-mod-logs-mc${{ matrix.mc }}
          path: |
            engine-mod/build/run/gameTest/logs
            engine-mod/build/reports/tests
            ${{ runner.temp }}/fabric-server/run-fabric-server*.log
            ${{ runner.temp }}/fabric-server/crash-reports
            ${{ runner.temp }}/vanilla-datapack/vanilla-datapack.log
            ${{ runner.temp }}/vanilla-datapack/crash-reports
            ${{ runner.temp }}/fabric-server-mob/run-fabric-server.log
            ${{ runner.temp }}/fabric-server-mob/crash-reports
            ${{ runner.temp }}/fabric-server-parity/run-fabric-server.log
            ${{ runner.temp }}/fabric-server-parity/crash-reports
          if-no-files-found: ignore
