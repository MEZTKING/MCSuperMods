name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node app/node_modules/electron/install.js
      - run: xvfb-run -a pnpm --filter @msm/app smoke
      - run: xvfb-run -a pnpm --filter @msm/app e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: app/e2e/output
          if-no-files-found: ignore
      - run: pnpm --filter @msm/app dist:dir
      - run: xvfb-run -a pnpm --filter @msm/app smoke:packaged
      - run: node tools/check-size/index.ts
