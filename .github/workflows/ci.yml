name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node app/node_modules/electron/install.js
      - run: xvfb-run -a pnpm --filter @msm/app smoke
      - run: xvfb-run -a pnpm --filter @msm/app e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-output
          path: app/e2e/output
          if-no-files-found: ignore
      - run: pnpm --filter @msm/app dist:dir
      - run: xvfb-run -a pnpm --filter @msm/app smoke:packaged
      - run: node tools/check-size/index.ts

  # The msm_runtime Fabric mod (ADR 0024, ADR 0026 D6): JUnit and GameTests through
  # `./gradlew build`, then the kitchen-sink sample (fixtures/sample-mod) exported with the real
  # runtime nested and started on a headless Fabric dedicated server (tools/run-fabric-server).
  # Action versions: setup-java and cache v6 (checked 2026-11-05).
  engine-mod:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      # A full checkout: the JUnit corpus test reads packages/schemas/mcdoc/msm/conformance/
      # relative to engine-mod/, so both folders must stay side by side.
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('engine-mod/*.gradle.kts', 'engine-mod/gradle.properties', 'engine-mod/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build msm_runtime (JUnit and GameTests)
        working-directory: engine-mod
        run: ./gradlew build --no-daemon
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Restored before the exports: the sample-mob export downloads GeckoLib into this cache
      # (from the target's GeckoLib facts, SHA-512 checked) when it is missing.
      # The key names GeckoLib so caches saved before it was added are not reused.
      - name: Cache Fabric server and GeckoLib downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/msm-fabric-server
          key: fabric-server-geckolib-${{ hashFiles('packages/targets/*/src/target.ts') }}
      - name: Find the msm_runtime jar
        run: |
          mapfile -t jars < <(ls "$GITHUB_WORKSPACE"/engine-mod/build/libs/msm_runtime-*.jar | grep -v -e '-sources\.jar$' -e '-dev\.jar$')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected one msm_runtime jar in engine-mod/build/libs, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          echo "Runtime jar: ${jars[0]}"
          echo "MSM_RUNTIME_JAR=${jars[0]}" >> "$GITHUB_ENV"
      - name: Export the sample mod with the real runtime
        run: |
          MSM_SAMPLE_MOD_OUT="$RUNNER_TEMP/sample-mod" \
            pnpm --filter @msm/exporters exec vitest run test/sample-mod.golden.test.ts
          test -f "$RUNNER_TEMP/sample-mod/msm_sample_mod.jar"
          cat "$RUNNER_TEMP/sample-mod/fabric-facts.json"
      - name: Export the sample mob with the real runtime and GeckoLib
        run: |
          MSM_GECKOLIB_JAR="$HOME/.cache/msm-fabric-server/geckolib.jar" MSM_SAMPLE_MOB_OUT="$RUNNER_TEMP/sample-mob" \
            pnpm --filter @msm/exporters exec vitest run test/sample-mob.golden.test.ts
          test -f "$RUNNER_TEMP/sample-mob/msm_sample_mob.jar"
          cat "$RUNNER_TEMP/sample-mob/fabric-facts.json"
      - name: Headless Fabric server check (sample mod)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-mod/msm_sample_mod.jar"
          --facts "$RUNNER_TEMP/sample-mod/fabric-facts.json"
          --work "$RUNNER_TEMP/fabric-server"
          --cache ~/.cache/msm-fabric-server
      - name: Headless Fabric server check (sample mob, GeckoLib nested)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-mob/msm_sample_mob.jar"
          --facts "$RUNNER_TEMP/sample-mob/fabric-facts.json"
          --work "$RUNNER_TEMP/fabric-server-mob"
          --cache ~/.cache/msm-fabric-server
      # Phase 6 (B139): scripts on a real server, the Java project eject built with Gradle, and
      # the behaviour-parity GameTests run against both the content jar and the ejected jar.
      - name: Export the sample script with the real runtime
        run: |
          MSM_SAMPLE_SCRIPT_OUT="$RUNNER_TEMP/sample-script" \
            pnpm --filter @msm/exporters exec vitest run test/sample-script.golden.test.ts
          test -f "$RUNNER_TEMP/sample-script/msm_sample_script.jar"
          cat "$RUNNER_TEMP/sample-script/fabric-facts.json"
      # Reuses the sample mod's run folder (the game server is already there); the facts'
      # expectScripts makes "[msm_runtime] loaded S script(s); 0 error(s)" required.
      - name: Headless Fabric server check (sample script, scripts loaded)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-script/msm_sample_script.jar"
          --facts "$RUNNER_TEMP/sample-script/fabric-facts.json"
          --work "$RUNNER_TEMP/fabric-server"
          --cache ~/.cache/msm-fabric-server
      - name: Build the parity GameTests
        working-directory: engine-mod
        run: |
          ./gradlew -p parity build --no-daemon
          mapfile -t jars < <(ls "$GITHUB_WORKSPACE"/engine-mod/parity/build/libs/msm_parity_tests-*.jar | grep -v -e '-sources\.jar$')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::Expected one msm_parity_tests jar, found ${#jars[@]}: ${jars[*]}"
            exit 1
          fi
          echo "MSM_PARITY_JAR=${jars[0]}" >> "$GITHUB_ENV"
      - name: Export the sample mod and the sample mob as Java projects
        run: |
          MSM_SAMPLE_MOD_JAVA_OUT="$RUNNER_TEMP/java/sample-mod" \
            pnpm --filter @msm/exporters exec vitest run test/sample-mod.java.golden.test.ts
          MSM_SAMPLE_MOB_JAVA_OUT="$RUNNER_TEMP/java/sample-mob" \
            pnpm --filter @msm/exporters exec vitest run test/sample-mob.java.golden.test.ts
          test -x "$RUNNER_TEMP/java/sample-mod/gradlew"
          test -x "$RUNNER_TEMP/java/sample-mob/gradlew"
      # Each written project builds with its own wrapper; the Gradle cache above holds the 26.3
      # artefacts. Loom's "(kSxHvs99) is not valid semver" line for the nested GeckoLib is harmless.
      - name: Build the ejected sample mod
        working-directory: ${{ runner.temp }}/java/sample-mod
        run: ./gradlew build --no-daemon
      - name: Build the ejected sample mob
        working-directory: ${{ runner.temp }}/java/sample-mob
        run: ./gradlew build --no-daemon
      - name: Find the ejected jars
        run: |
          for sample in mod mob; do
            mapfile -t jars < <(ls "$RUNNER_TEMP/java/sample-$sample"/build/libs/msm_sample_$sample-*.jar | grep -v -e '-sources\.jar$')
            if [ "${#jars[@]}" -ne 1 ]; then
              echo "::error::Expected one ejected sample-$sample jar, found ${#jars[@]}: ${jars[*]}"
              exit 1
            fi
            echo "Ejected sample-$sample jar: ${jars[0]}"
            echo "MSM_EJECTED_${sample^^}_JAR=${jars[0]}" >> "$GITHUB_ENV"
          done
      # The four parity runs share one run folder (the game server is downloaded once); each
      # writes its own report. The filter picks the sample's tests from the one parity jar.
      - name: Parity GameTests (sample mod, content jar)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-mod/msm_sample_mod.jar"
          --facts "$RUNNER_TEMP/sample-mod/fabric-facts.json"
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_mod_*'
          --report "$RUNNER_TEMP/parity-reports/sample-mod-content.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      - name: Parity GameTests (sample mod, ejected jar)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$MSM_EJECTED_MOD_JAR"
          --facts "$RUNNER_TEMP/sample-mod/fabric-facts.json" --no-runtime
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_mod_*'
          --report "$RUNNER_TEMP/parity-reports/sample-mod-ejected.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      - name: Parity GameTests (sample mob, content jar)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$RUNNER_TEMP/sample-mob/msm_sample_mob.jar"
          --facts "$RUNNER_TEMP/sample-mob/fabric-facts.json"
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_mob_*'
          --report "$RUNNER_TEMP/parity-reports/sample-mob-content.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      - name: Parity GameTests (sample mob, ejected jar)
        run: >-
          node tools/run-fabric-server/index.ts
          --jar "$MSM_EJECTED_MOB_JAR"
          --facts "$RUNNER_TEMP/sample-mob/fabric-facts.json" --no-runtime
          --gametest "$MSM_PARITY_JAR" --gametest-filter 'msm_parity_tests:sample_mob_*'
          --report "$RUNNER_TEMP/parity-reports/sample-mob-ejected.xml"
          --work "$RUNNER_TEMP/fabric-server-parity"
          --cache ~/.cache/msm-fabric-server
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msm-sample-mod
          path: ${{ runner.temp }}/sample-mod/msm_sample_mod.jar
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msm-sample-mob
          path: ${{ runner.temp }}/sample-mob/msm_sample_mob.jar
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msm-sample-script
          path: ${{ runner.temp }}/sample-script/msm_sample_script.jar
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: msm-ejected-jars
          path: |
            ${{ runner.temp }}/java/sample-mod/build/libs/*.jar
            ${{ runner.temp }}/java/sample-mob/build/libs/*.jar
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parity-gametest-reports
          path: ${{ runner.temp }}/parity-reports
          if-no-files-found: ignore
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: engine-mod-logs
          path: |
            engine-mod/build/run/gameTest/logs
            engine-mod/build/reports/tests
            ${{ runner.temp }}/fabric-server/run-fabric-server.log
            ${{ runner.temp }}/fabric-server/crash-reports
            ${{ runner.temp }}/fabric-server-mob/run-fabric-server.log
            ${{ runner.temp }}/fabric-server-mob/crash-reports
            ${{ runner.temp }}/fabric-server-parity/run-fabric-server.log
            ${{ runner.temp }}/fabric-server-parity/crash-reports
          if-no-files-found: ignore
