# The documentation site (ADR 0039): builds the user guide in docs/guide/ with VitePress
# (docs/site/) and deploys it to GitHub Pages at https://meztking.github.io/MCSuperMods/.
#
# One-time setting (the repository owner): Settings > Pages > Build and deployment > Source:
# "GitHub Actions". Until then the build job passes and the deploy job fails.
#
# No secrets: the deployment authenticates with the job's OIDC token (id-token: write).
# Action versions: checkout v7, pnpm/action-setup v6, setup-node v7 (as ci.yml);
# configure-pages v6, upload-pages-artifact v5, deploy-pages v5 (checked 2026-11-05).
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push does not cancel a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @msm/site build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
