# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Minecraft and Fabric facts come from ../versions/<mc>.properties (`-Pmc=<mc>`, default: ../gradle.properties
# default_mc; ADR 0038 D5). The four keys below only mirror engine-mod/gradle.properties for tools/check-deps;
# the build never reads them.
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.3
fabric_api_version=0.165.2+26.3

# Parity test mod (ADR 0033 D5); never shipped to users. The jar is msm_parity_tests-<mod_version>+mc<mc>.jar.
mod_version=0.0.0
maven_group=dev.mcsupermods
archives_base_name=msm_parity_tests
