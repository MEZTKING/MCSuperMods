# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Minecraft version (ADR 0038 D1): `-Pmc=<mc>` selects versions/<mc>.properties (Minecraft, Loader,
# Loom, Fabric API, GeckoLib, the fabric.mod.json "minecraft" range); without it default_mc.
default_mc=26.3

# Mirror of versions/26.3.properties for tools/check-deps, which compares these keys with
# parity/gradle.properties. The build never reads them and fails if they differ from
# versions/<default_mc>.properties.
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.3
fabric_api_version=0.165.2+26.3

# GeckoLib for versions without a GeckoLib build (blank geckolib_modrinth_version_id): the bridge
# compiles against this jar (geckolib-fabric-26.3-5.5.7.jar on Modrinth) and GeckoLib never runs (ADR 0038 D3).
geckolib_compile_fallback_version_id=kSxHvs99

# Scripting (Rhino runtime jar, nested; ADR 0031 D1, verified 2026-11-05)
rhino_version=1.9.2

# Tests (JUnit BOM, 2026-11-05)
junit_version=5.14.2

# Mod (mod_version equals app/package.json "version"; app/test/runtime-version.test.ts, ADR 0026 D4).
# The jar is msm_runtime-<mod_version>+mc<mc>.jar with "version": "<mod_version>+mc<mc>" (ADR 0038 D3).
mod_version=1.1.0
maven_group=dev.mcsupermods
archives_base_name=msm_runtime
