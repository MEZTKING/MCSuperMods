# electron-builder configuration (ADR 0013, plan D8).
# electron-vite bundles main, preload and renderer into `out/`, so every app dependency is a
# devDependency and the packaged app collects no node_modules.
appId: dev.mcsupermods.app
productName: MCSuperMods
executableName: mcsupermods
asar: true
npmRebuild: false
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# The msm_runtime jar the Fabric content jar nests (ADR 0026 D4), read by the packaged app
# from `resources/runtime/msm_runtime.jar`. `scripts/stage-runtime.mjs` (run by `dist` and
# `dist:dir`) copies it from `engine-mod/build/libs/`; when it is absent electron-builder
# warns "file source doesn't exist" and packages the app without it.
extraResources:
  - from: build/runtime/msm_runtime.jar
    to: runtime/msm_runtime.jar
  # The Gradle wrapper the Java project export copies (ADR 0033 D2), read from
  # `resources/runtime/gradle-wrapper/`; staged by `scripts/stage-runtime.mjs` from `engine-mod/`.
  - from: build/runtime/gradle-wrapper
    to: runtime/gradle-wrapper

# Release target: Windows installer, unsigned until the user supplies signing credentials.
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  # Auto-update (ADR 0018): electron-updater with the GitHub provider. `pnpm dist` passes
  # `--publish never`; the release workflow passes `--publish always`, which uploads the
  # installer, its `.blockmap` and `latest.yml` to a draft release that the maintainer
  # publishes by hand. The updater only sees published releases. The packaged app reads this
  # configuration as `resources/app-update.yml`.
  publish:
    provider: github
    owner: MEZTKING
    repo: MCSuperMods
    releaseType: draft
# NSIS writes `latest.yml` and a differential `.blockmap` next to the installer whenever a
# publish provider is configured.
nsis:
  differentialPackage: true
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# Linux `dir` is the local and CI verification build only (packaged smoke runs on Linux).
# It is not published.
linux:
  icon: build/icon.png
  category: Development
  target:
    - dir
  # Never published, and the updater is inactive off Windows.
  publish: null

# macOS is out of scope for now (user decision, 2026-11-04).
